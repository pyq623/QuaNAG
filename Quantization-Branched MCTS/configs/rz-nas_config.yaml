# ============================================================================
# RZ-NAS 配置文件
# Reflective Zero-Cost Neural Architecture Search
# ============================================================================

# ============================================================================
# 搜索参数
# ============================================================================
search:
  # 数据集配置
  dataset: 'Mhealth'  # 可选: Mhealth, PAMAP2, UTD-MHAD, CIFAR10, CIFAR100, ImageNet
  
  # 内存约束
  memory_budget: 15  # MB - 内存预算（会根据量化自动调整）
  
  # Zero-Cost Proxy 配置
  zero_cost_proxy: 'composite'  # 可选: snip, grasp, synflow, zico, zen, composite
  
  # 种群配置
  population_size: 100  # 种群大小（论文中通常使用 100）
  max_iterations: 1500  # 最大搜索迭代次数（论文中使用 1500）
  
  # 选择策略
  selection_strategy: 'mixed'  # 可选: random, best, tournament, roulette, mixed, adaptive

  # 搜索空间类型
  search_space_type: 'quant'  # 可选: quant, none - 搜索空间类型（量化或非量化）

# ============================================================================
# 训练参数（用于最终评估阶段）
# ============================================================================
training:
  # 训练轮数
  train_epochs: 200  # 最终训练的轮数
  
  # GPU配置
  num_gpus: 4  # 使用的GPU数量（支持GPU复用）
  
  # 是否跳过训练
  skip_training: false  # true=只搜索不训练, false=搜索后训练最佳架构

# ============================================================================
# 反思模块配置
# ============================================================================
reflection:
  # 历史记录配置
  max_history: 10  # 保存的最大反思历史数
  context_length: 3  # 每次反思时使用的历史上下文数量
  
  # 反思触发条件
  trigger_on_failure: true  # 变异失败时是否触发反思
  trigger_on_success: true  # 变异成功时是否触发反思


# ============================================================================
# Zero-Cost Proxy 详细配置
# ============================================================================
zero_cost:
  # 批次大小
  batch_size: 16  # Zero-Cost评估时的批次大小
  
  # Composite模式下的权重配置
  composite_weights:
    grad_norm: 0.20
    zen: 0.15
    synflow: 0.25
    zico: 0.25
    grasp: 0.15
  
  # 评估重复次数
  num_repeats: 1  # 每个架构评估的重复次数（取平均）

# ============================================================================
# 日志配置
# ============================================================================
logging:
  # 日志目录
  log_dir: './logs/rz-nas'  # 日志保存路径
  
  # 保存频率
  save_frequency: 10  # 每N次迭代保存一次日志
  
  # 检查点配置
  checkpoint:
    enabled: true  # 是否保存检查点
    save_frequency: 50  # 每N次迭代保存一次检查点
  
  # 详细程度
  verbose: true  # 是否打印详细日志